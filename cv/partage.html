<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Image de partage (1200 × 630)</title>
<link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400..800&family=Newsreader:ital,opsz,wght@1,6..72,400..600&display=block" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; }
body { width: 1200px; height: 630px; overflow: hidden; position: relative; color: #0b1613; font-family: "Host Grotesk", sans-serif; background: linear-gradient(#cfdad5 1px, #0000 1px) 0 0/90px 90px, linear-gradient(90deg, #cfdad5 1px, #0000 1px) 0 0/90px 90px, #f7f9f8; }
.card { position: absolute; inset: 60px; padding: 64px; background: #fff; border: 2px solid #0b1613; }
p { font-size: 32px; font-weight: 560; display: flex; align-items: center; gap: 18px; }
p::before { content: ""; width: 18px; height: 18px; background: #0b7a55; }
h1 { font-size: 104px; line-height: 1.04; letter-spacing: -.04em; font-weight: 640; margin-top: 56px; }
em { font-family: Newsreader, serif; font-weight: 450; color: #0b7a55; border-bottom: 6px solid; }
.corner { position: absolute; right: -2px; bottom: -2px; width: 150px; height: 150px; background: #0b7a55; clip-path: polygon(100% 0, 100% 100%, 0 100%); }
</style>
</head>
<body><div class="card"><p>Rayan Rimane, développeur web et logiciel</p><h1>Du besoin concret<br><em>à l'application.</em></h1><div class="corner"></div></div></body>
</html>
